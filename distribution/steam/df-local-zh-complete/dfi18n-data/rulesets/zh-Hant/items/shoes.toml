base = "items::shoes"

[[rulesets]]
[rulesets.rules]
"{::items::prefix::maybe_equipment_size}{main}" = "{::items::prefix::maybe_equipment_size}{main}"

[[rulesets]]
name = "main"

  [rulesets.rules]
  "{default}" = "{default}"
  "{singular}" = "{singular}"
  "{plural}" = "{plural}"

[[rulesets]]
name = "default"

  [rulesets.rules]
  "{default::^0}{default::main}" = "{default::^0}{default::main}"

[[rulesets]]
name = "default::^0"
optional = true

  [rulesets.rules]
  "{::materials::adjective} " = "{::materials::adjective}"

[[rulesets]]
name = "default::main"

  [rulesets.rules]
  footwear = "足裝"

[[rulesets]]
name = "singular"

  [rulesets.rules]
  "{^material}{^chain}{singular::main}" = "{^material}{^chain}{singular::main}"

[[rulesets]]
name = "plural"

  [rulesets.rules]
  "{^material}{^chain}{plural::main}" = "{^material}{^chain}{plural::main}"

[[rulesets]]
name = "^material"
optional = true

  [rulesets.rules]
  "{::materials::adjective} " = "{::materials::adjective}"

[[rulesets]]
name = "^chain"
optional = true

  [rulesets.rules]
  "chain " = "鎖鏈"

[[rulesets]]
name = "singular::main"

  [rulesets.rules]
  shoe = "鞋"
  "high boot" = "高筒靴"
  "low boot" = "短筒靴"
  sandal = "涼鞋"
  chausse = "馬褲"
  sock = "襪"

[[rulesets]]
name = "plural::main"

  [rulesets.rules]
  shoes = "鞋"
  "high boots" = "高筒靴"
  "low boots" = "短筒靴"
  sandals = "涼鞋"
  chausses = "馬褲"
  socks = "襪"
