base = "items::trapcomp"

[[rulesets]]
[rulesets.rules]
"{default}" = "{default}"
"{singular}" = "{singular}"
"{plural}" = "{plural}"

[[rulesets]]
name = "default"

  [rulesets.rules]
  "{default::^0}{default::main}" = "{default::^0}{default::main}"

[[rulesets]]
name = "default::^0"
optional = true

  [rulesets.rules]
  "{::materials::adjective} " = "{::materials::adjective}"

[[rulesets]]
name = "default::main"

  [rulesets.rules]
  "trap component" = "陷阱元件"
  "trap components" = "陷阱元件"

[[rulesets]]
name = "^prefix"
optional = true

  [rulesets.rules]
  "giant " = "巨型"
  "enormous " = "大號"
  "spiked " = "尖刺"
  "large, serrated " = "大型"
  "menacing " = "險惡"

[[rulesets]]
name = "^material"
optional = true

  [rulesets.rules]
  "{::materials::adjective} " = "{::materials::adjective}"

[[rulesets]]
name = "singular"

  [rulesets.rules]
  "{^prefix}{^material}{singular::main}" = "{^prefix}{^material}{singular::main}"

[[rulesets]]
name = "plural"

  [rulesets.rules]
  "{^prefix}{^material}{plural::main}" = "{^prefix}{^material}{plural::main}"

[[rulesets]]
name = "singular::main"

  [rulesets.rules]
  "axe blade" = "斧刃"
  corkscrew = "螺桿"
  ball = "圓球"
  disc = "鋸盤"
  spike = "尖刺"

[[rulesets]]
name = "plural::main"

  [rulesets.rules]
  "axe blades" = "斧刃"
  corkscrews = "螺桿"
  balls = "圓球"
  discs = "鋸盤"
  spikes = "尖刺"
