name: validate

on:
  push:
  pull_request:

jobs:
  broker:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/broker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node validate-workshop-package.mjs ../../distribution/steam/df-local-zh-complete

  native:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/df-local-zh-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Make bundled SDL libraries available to native tests
        shell: pwsh
        run: |
          $sdlDirectory = Join-Path $PWD 'crates/sdl2-sys/prebuild'
          if (!(Test-Path (Join-Path $sdlDirectory 'SDL2.dll'))) { throw 'Bundled SDL2.dll missing' }
          $sdlDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo test --workspace
